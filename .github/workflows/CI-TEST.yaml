name: CI - Test

on:
  workflow_run:
    workflows: ["CI - dev"]
    types:
      - completed

# --------------------------------------------- TEST ENV ---------------------------------------------

jobs:
  test_env:
    runs-on: ubuntu-latest
    envirement:
      name: test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      
      - name: Azure Login (CLI for later az commands)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CRED }}

      - name: Export ARM_* env vars for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform -chdir=IAC/envs/test init
      
      - name: Terraform Validate
        run: terraform -chdir=IAC/envs/test validate
     
      - name: Terraform Apply
        run: terraform -chdir=IAC/envs/test apply -auto-approve

      - name: Output ACR Login Server
        id: acr_info
        run: |
          echo "acr_login_server=$(terraform -chdir=IAC/envs/test output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "acr_name=$(terraform -chdir=IAC/envs/test output -raw acr_name)" >> $GITHUB_OUTPUT
    
    outputs:
      acr_login_server: ${{ steps.acr_info.outputs.acr_login_server }}
      acr_name: ${{ steps.acr_info.outputs.acr_name }}