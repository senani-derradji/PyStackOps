name: CI_TEST

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test_env:
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Export ARM_* env vars for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CRED }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Create SSH public key file
        run: |
          # Write the SSH key to a file
          echo '${{ secrets.SSH_PUBLIC_KEY }}' > ssh_key.pub
          # Verify the file content (optional debugging)
          echo "SSH key content:"
          cat ssh_key.pub

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform -chdir=IAC/envs/test init

      - name: Terraform Validate
        run: |
          SSH_KEY_CONTENT=$(cat ssh_key.pub)
          terraform -chdir=IAC/envs/test -var "ssh_public_key=$SSH_KEY_CONTENT" validate

      - name: Terraform PLAN
        run: |
          SSH_KEY_CONTENT=$(cat ssh_key.pub)
          terraform -chdir=IAC/envs/test -var "ssh_public_key=$SSH_KEY_CONTENT" plan

      - name: Terraform Apply
        run: |
          SSH_KEY_CONTENT=$(cat ssh_key.pub)
          terraform -chdir=IAC/envs/test -var "ssh_public_key=$SSH_KEY_CONTENT" apply -auto-approve