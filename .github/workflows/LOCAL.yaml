name: Test Runner

on: [push]

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          python3 -m pip install requests
          apt update
      - name: Run tests
        run: python3 app/test-app.py
      
      

