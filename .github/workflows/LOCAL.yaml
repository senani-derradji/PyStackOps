name: Test Runner

on: [push]

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run tests
        run: |
          echo "Running tests..."
          ls
          python3 -m venv env-ops
          source env-ops/bin/activate
          ls
          sleep 2
          python3 app/test-app.py
