- name: Local Runner
  hosts: runners
  become: yes

  vars:
    runner_dir: /home/derradji/actions-runner # Change this to your desired directory
    runner_version: 2.317.0
    runner_package: actions-runner-linux-x64-{{ runner_version }}.tar.gz
    runner_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ runner_package }}"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - git
          - tar
        state: present
        update_cache: yes

    - name: Ensure actions-runner directory exists
      file:
        path: "{{ runner_dir }}"
        state: directory
        owner: derradji
        group: derradji
        mode: '0755'

    - name: Download GitHub Actions runner package
      get_url:
        url: "{{ runner_url }}"
        dest: "{{ runner_dir }}/{{ runner_package }}"
        mode: '0644'
        force: yes

    - name: Extract GitHub Actions runner
      unarchive:
        src: "{{ runner_dir }}/{{ runner_package }}"
        dest: "{{ runner_dir }}"
        remote_src: yes
      args:
        creates: "{{ runner_dir }}/config.sh"

    - name: Copy runner setup script
      copy:
        src: ./runner.sh
        dest: "{{ runner_dir }}/runner.sh"
        owner: derradji
        group: derradji
        mode: '0755'

    - name: Run runner setup script
      become: false
      shell: ./runner.sh
      args:
        chdir: "{{ runner_dir }}"
        executable: /bin/bash

    - name: Install and start runner service
      shell: |
        ./svc.sh install
        ./svc.sh start
      args:
        chdir: "{{ runner_dir }}"
        executable: /bin/bash